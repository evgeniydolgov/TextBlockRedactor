schema: spec-driven

context: |
  Проект: локальный минимальный текстовый редактор.
  Стек: React 19, TypeScript, Vite, Tiptap OSS 3, CSS.
  Backend, облако, коллаборация и платные расширения отсутствуют.
  Сейчас: текст, абзацы, H1-H3, undo/redo; одна заметка сохраняется в localStorage.
  Один экземпляр редактора на документ; initialContent и onChange(NoteDocument).
  NoteDocument — плоский массив BlockNote-совместимых paragraph/heading H1-H3.
  Пропсы maxBlockCharacters/maxNoteCharacters/maxBlocks имеют defaults 8000/50000/100.
  Считается .length объединённых text (UTF-16); surrogate pairs не разрываются.
  Переполнение создаёт paragraph с UUID v7. Paste сохраняет только помещающийся префикс.
  Загрузка и уменьшение лимитов обрезают хвост до отображения; mount не пишет storage.
  Лимиты экземпляра применяются до onChange, в том числе к IME, merge и undo/redo.
  При split старый ID всегда у первого фрагмента, включая пустой; новый — у второго.
  onChange передаёт последний снимок после паузы saveDelayMs (по умолчанию 1000 мс).
  При уходе/cleanup ожидающий снимок передаётся сразу. Страница сохраняет и логирует блоки.
  Ключ localStorage text-block-redactor:note:v1; загрузка до создания редактора.
  Ошибки storage видны пользователю и не прерывают редактирование.
  Preview сравнивает начальный/последний обработанный снимок и выводит [note:requests].
  HTTP не выполняется; before — предыдущий ID, after — следующий, на границах null.
  Последний цикл записан в text-block-redactor:request-log:v1 без истории и времени.
  Он содержит requests и storage { key, data, success, error }; не служит базой загрузки.
  Прочитай AGENTS.md и docs/agents/README.md.
  Документы пиши по-русски; синтаксис OpenSpec оставляй на английском.

rules:
  proposal:
    - Укажи проблему, границы задачи и что не входит в изменение.
    - Не добавляй новые функции сверх запроса.
  specs:
    - Требования должны содержать SHALL и проверяемые сценарии WHEN/THEN.
    - Опиши существенные граничные случаи.
  design:
    - Выбирай минимальное решение и объясняй новые зависимости.
  tasks:
    - Включи применимые проверки из docs/agents/acceptance.md.
    - Отмечай задачу выполненной только после проверки результата.
