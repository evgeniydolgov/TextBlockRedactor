schema: spec-driven

context: |
  Проект: локальный минимальный текстовый редактор.
  Стек: React 19, TypeScript, Vite, Tiptap OSS 3, CSS.
  Backend, облако, коллаборация и платные расширения отсутствуют.
  Сейчас: текст, абзацы, H1-H3, undo/redo; данные только в памяти.
  Один экземпляр редактора на документ; initialContent и onChange(JSON).
  Прочитай AGENTS.md и docs/agents/README.md.
  Документы пиши по-русски; синтаксис OpenSpec оставляй на английском.

rules:
  proposal:
    - Укажи проблему, границы задачи и что не входит в изменение.
    - Не добавляй новые функции сверх запроса.
  specs:
    - Требования должны содержать SHALL и проверяемые сценарии WHEN/THEN.
    - Опиши существенные граничные случаи.
  design:
    - Выбирай минимальное решение и объясняй новые зависимости.
  tasks:
    - Включи применимые проверки из docs/agents/acceptance.md.
    - Отмечай задачу выполненной только после проверки результата.
